name: Assemble voice narration

# Stitches pre-rendered Fish Audio chunks listed in
# scripts/voice-chunks.json into assets/audio/*.mp3 plus the manifest,
# and commits the result back to the branch it was run on. Runs here
# because the runners have ffmpeg and open egress to the Fish Audio CDN.
#
# Manual only. It used to run on every push that touched the chunk map
# or the assembler; the section tracks it built are retired, the map is
# empty, and rendered narration should never follow from an unrelated
# edit. With an empty map the assembler changes nothing and there is
# nothing to commit. Whatever it does build must pass the audio budget
# before it is committed — the site ships at most Moses's own recorded
# introduction (scripts/check-budget.js).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Count the sections to assemble
        id: plan
        run: node -e "const p = require('./scripts/voice-chunks.json'); console.log('sections=' + (p.sections || []).length)" >> "$GITHUB_OUTPUT"
      - name: Install ffmpeg
        if: steps.plan.outputs.sections != '0'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: node scripts/assemble-voice.js
      - name: Hold the result to the audio budget
        run: node scripts/check-budget.js
      - name: Commit the narration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Add recorded narration (assembled from Fish Audio chunks)"
            git push
          fi
