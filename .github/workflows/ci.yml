name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # The jsdom suites above exercise the logic; this opens every page in a
  # real browser and fails on console errors, failed or off-origin requests,
  # an on-demand module that does not arrive, or a first view heavier than
  # the budget estimates. It uses the Chrome the runner image ships with.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run smoke -- --require
        env:
          SMOKE_CHROME: /usr/bin/google-chrome
