<!DOCTYPE html>
<!--
    THE CV TEMPLATE — printed to assets/Moses_Kolleh_Sesay_CV.pdf by
    `npm run cv` (scripts/build-cv.js). Not a page of the site: the PDF is
    what a recruiter downloads, and the homepage already says everything it
    does. Each "CV:" slot below is filled from content/ and the homepage;
    the words here are headings only, so the CV can say nothing the site
    does not. Two A4 pages: tests/cv.test.js counts them.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Moses Kolleh Sesay — CV</title>
    <style>
        /* CV:FONTS */

        @page { size: A4; margin: 13mm 15mm 12mm; }

        :root {
            --ink: #18211c;
            --dim: #4b5a52;
            --green: #1a7a1a;
            --rule: #c9d6cd;
        }

        html {
            font-family: 'Inter', sans-serif;
            font-size: 8.7pt;
            line-height: 1.34;
            color: var(--ink);
            /* Ligatures off: a reader's or an applicant-tracking system's
               copy of "fi" should be two letters, not one glyph. */
            font-variant-ligatures: none;
            font-feature-settings: 'liga' 0, 'calt' 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body { margin: 0; }
        a { color: inherit; text-decoration: none; }
        p, ul { margin: 0; }

        header { border-bottom: 1.2pt solid var(--green); padding-bottom: 6pt; margin-bottom: 2pt; }
        h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21pt; line-height: 1.05; margin: 0; letter-spacing: -0.01em; }
        .role { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11pt; color: var(--green); margin: 2pt 0 4pt; }
        .contact, .open { font-size: 8.4pt; color: var(--dim); }
        .contact span + span::before, .run span + span::before { content: ' · '; color: var(--green); }
        .open { margin-top: 1pt; }

        h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 9.6pt;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--green);
            border-bottom: 0.5pt solid var(--rule);
            padding-bottom: 1.5pt;
            margin: 9pt 0 4pt;
            break-after: avoid;
        }

        .summary p + p { margin-top: 2pt; }

        .entry { break-inside: avoid; margin-bottom: 5.5pt; }
        .entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10pt; }
        .entry-title { font-weight: 600; }
        .when { font-family: 'IBM Plex Mono', monospace; font-size: 7.6pt; color: var(--dim); white-space: nowrap; }
        .where { color: var(--dim); }
        .entry ul { padding-left: 10pt; margin-top: 1pt; }
        .entry li { margin: 0.5pt 0; }
        .entry li::marker { color: var(--green); }
        .note { color: var(--dim); }
        .check { font-family: 'IBM Plex Mono', monospace; font-size: 7.2pt; color: var(--green); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }

        .work ul { padding-left: 10pt; }
        .work li { break-inside: avoid; margin: 0.5pt 0; }
        .work li::marker { color: var(--green); }

        /* Two certificates to a row: each is a name, a date and a line. */
        .pair { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14pt; }
        .url { font-family: 'IBM Plex Mono', monospace; font-size: 7.6pt; color: var(--green); white-space: nowrap; }

        .skills dt { font-weight: 600; float: left; clear: left; width: 21%; }
        .skills dd { margin: 0 0 1.5pt 22%; }
        .run { color: var(--dim); }

        footer { margin-top: 8pt; padding-top: 4pt; border-top: 0.5pt solid var(--rule); font-size: 7.6pt; color: var(--dim); }
    </style>
</head>
<body>
    <header>
        <!-- CV:HEADER -->
    </header>
    <main>
        <section class="summary">
            <h2>Profile</h2>
            <!-- CV:PROFILE -->
        </section>
        <section>
            <h2>Experience</h2>
            <!-- CV:EXPERIENCE -->
        </section>
        <section>
            <h2>Selected projects</h2>
            <!-- CV:PROJECTS -->
        </section>
        <section>
            <h2>Education</h2>
            <!-- CV:EDUCATION -->
        </section>
        <section>
            <h2>Certificates</h2>
            <div class="pair">
                <!-- CV:CERTIFICATES -->
            </div>
        </section>
        <section class="work">
            <h2>Public work</h2>
            <!-- CV:WORK -->
        </section>
        <section>
            <h2>Skills</h2>
            <!-- CV:SKILLS -->
        </section>
    </main>
    <footer>
        <!-- CV:FOOTER -->
    </footer>
</body>
</html>
